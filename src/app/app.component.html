<app-navbar></app-navbar>
<app-sidebar [apps]="apps"></app-sidebar>
<div class="container"
  [class.mobile]="width <= 768"
  [style.marginLeft]="width > 768 ? (sidebar.isSidebarOpen ? (sidebar.isCollapsed ? '80px' : '305px') : '0px') : '0px'"
  [style.width]="width > 768 ? (sidebar.isSidebarOpen ? (sidebar.isCollapsed ? 'calc(100% - 80px)' : 'calc(100% - 305px)') : '100%') : '100%'">
  <router-outlet></router-outlet>
</div>

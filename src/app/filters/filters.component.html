<div class="mobile-filters" *ngIf="showFilterButton">
  <button class="filter-button" (click)="toggleFilters()">
    <span class="material-symbols-outlined">filter_alt</span>
    <span class="text">{{showFilters ? 'Hide' :'Show'}} Filters</span>
  </button>
</div>

<div class="filter-container" [class.collapsed]="!showFilters">
  <div class="filter-header">
    <h3 class="filter-title">
      <span class="material-symbols-outlined">filter_alt</span>
      Filters
    </h3>
    <div class="header-actions">
      <button class="ai-tools-btn" [class.active]="openAI" (click)="openAITools()" type="button">
        <span class="material-symbols-outlined">smart_toy</span>
        {{openAI ? 'Hide' : 'Show'}} AI Tools
      </button>
      <button class="clear-filters-btn" (click)="clearFilters()" type="button">
        <span class="material-symbols-outlined">clear_all</span>
        Clear All
      </button>
    </div>
  </div>

  <div class="filter-grid">
    <!-- Search keyword -->
    <div class="filter-group">
      <label class="filter-label">
        <span class="material-symbols-outlined">search</span>
        Search Keyword
      </label>
      <div class="search-input-wrapper">
        <input type="text" class="filter-input" placeholder="Search reviews..." (keyup)="searchInput($event)" autocomplete="off">
        <span class="material-symbols-outlined search-icon">search</span>
      </div>
    </div>

    <!-- Rating selectors -->
    <div class="filter-group">
      <label class="filter-label">
        <span class="material-symbols-outlined">star</span>
        Ratings
      </label>
      <div class="rating-chips">
        <button type="button" 
                *ngFor="let rate of ratings" 
                class="rating-chip" 
                [class.selected]="rate.isSelected"
                (click)="toggleRatingSelection(rate)">
          <span>{{rate.text}}</span>
          <span class="checkmark" *ngIf="rate.isSelected">&#10003;</span>
        </button>
      </div>
    </div>

    <!-- Version custom dropdown -->
    <div class="filter-group">
      <label class="filter-label">
        <span class="material-symbols-outlined">layers</span>
        Version
      </label>
      <div class="multi-select-container">
        <div class="multi-select-display" (click)="toggleDropdown('version')" [class.open]="openDropdown === 'version'">
          <span class="selected-text">{{selectedVersion}}</span>
          <span class="material-symbols-outlined">expand_more</span>
        </div>
        <div class="multi-select-dropdown" *ngIf="openDropdown === 'version'">
          <div class="dropdown-options">
            <div class="option-label" (click)="selectVersion('-1')" [class.selected]="selectedVersion === 'All Versions'">
              <span>All Versions</span>
            </div>
            <div class="option-label" *ngFor="let ver of versions" (click)="selectVersion(ver)" [class.selected]="selectedVersion === (ver != null ? ver.toString() : 'NA')">
              <span>{{ver != null ? ver : 'NA'}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Year custom dropdown -->
    <div class="filter-group">
      <label class="filter-label">
        <span class="material-symbols-outlined">calendar_today</span>
        Year
      </label>
      <div class="multi-select-container">
        <div class="multi-select-display" (click)="toggleDropdown('year')" [class.open]="openDropdown === 'year'">
          <span class="selected-text">{{selectedYear}}</span>
          <span class="material-symbols-outlined">expand_more</span>
        </div>
        <div class="multi-select-dropdown" *ngIf="openDropdown === 'year'">
          <div class="dropdown-options">
            <div class="option-label" (click)="selectYear('-1')" [class.selected]="selectedYear === 'All Years'">
              <span>All Years</span>
            </div>
            <div class="option-label" *ngFor="let yr of years" (click)="selectYear(yr)" [class.selected]="selectedYear === (yr != null ? yr.toString() : 'NA')">
              <span>{{yr != null ? yr : 'NA'}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Segmented Sort Control Wrapper -->
  <div class="sorting-wrapper">
    <div class="sorting-label">
      <span class="material-symbols-outlined">sort</span>
      Sort By
    </div>
    <div class="sort-segmented-control">
      <button class="sort-btn" [class.active]="versionSorted.sorted" (click)="sortByEmit('version')">
        <span>Version</span>
        <span class="sort-direction-icon" *ngIf="versionSorted.sorted">
          {{versionSorted.type === 'A' ? '▲' : '▼'}}
        </span>
      </button>
      <button class="sort-btn" [class.active]="ratingSorted.sorted" (click)="sortByEmit('rating')">
        <span>Rating</span>
        <span class="sort-direction-icon" *ngIf="ratingSorted.sorted">
          {{ratingSorted.type === 'A' ? '▲' : '▼'}}
        </span>
      </button>
      <button class="sort-btn" [class.active]="dateSorted.sorted" (click)="sortByEmit('date')">
        <span>Date</span>
        <span class="sort-direction-icon" *ngIf="dateSorted.sorted">
          {{dateSorted.type === 'A' ? '▲' : '▼'}}
        </span>
      </button>
    </div>
  </div>
</div>

<div class="chat-container" *ngIf="hasAppsBeenSelected">
  <!-- Main chat display area -->
  <div class="chat-history-container">
    <div class="chat-message" *ngFor="let chat of chatHistory" [ngClass]="{'user-message': chat.sender === 'You', 'ai-message': chat.sender === 'AI', 'error-message': chat.sender === 'Error'}">
      <div class="sender">{{ chat.sender }}</div>
      <div class="message-content">
        <div class="message" *ngIf="chat.message != '[AI is typing...]'" #messageRef [innerHTML]="chat.message"></div>
        <div class="message loader-wrap" *ngIf="chat.sender == 'AI' && chat.message == '[AI is typing...]'">
          <app-loader></app-loader>
        </div>
        <button class="copy-btn" *ngIf="chat.message != '[AI is typing...]'" (click)="copy()" type="button" title="Copy Message">
          <span class="material-symbols-outlined">content_copy</span>
          <span>Copy</span>
        </button>
      </div>
    </div>

    <!-- Loading spinner/text -->
    <div class="loading-indicator" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Analyzing reviews and initializing AI session...</p>
    </div>
  </div>

  <!-- Chat input form -->
  <form [formGroup]="chatForm" (ngSubmit)="sendMessage()" class="chat-input-form">
    <input type="text" name="message" id="prompt-message" class="prompt-message" formControlName="message" placeholder="Ask about app insights, bugs, feature requests..." [disabled]="isLoading || !sessionId" autocomplete="off">
    <button type="submit" class="send-btn" [disabled]="chatForm.invalid || isLoading || !sessionId">
      <span>Send</span>
      <mat-icon>send</mat-icon>
    </button>
  </form>
</div>

<div class="app-selector" *ngIf="!hasAppsBeenSelected">
  <div class="selector-card">
    <div class="selector-header">
      <mat-icon class="header-icon">psychology</mat-icon>
      <div class="header-titles">
        <h2>AI Multi-App Assistance</h2>
        <p>Select the apps you wish to analyze together with Google Gemini AI</p>
      </div>
    </div>
    
    <div class="apps-grid">
      <div class="app-card" *ngFor="let app of allApps" (click)="selectApp(app)" [ngClass]="{'selected': app.isSelected}">
        <div class="checkbox-wrapper">
          <mat-icon *ngIf="!app.isSelected" class="checkbox-icon">check_box_outline_blank</mat-icon>
          <mat-icon *ngIf="app.isSelected" class="checkbox-icon checked">check_box</mat-icon>
        </div>
        <div class="app-info-wrap">
          <span class="app-title-name">{{getAppName(app.id)}}</span>
          <span class="app-platform-pill" [ngClass]="app.platform?.toLowerCase()">
            {{app.platform | uppercase}}
          </span>
        </div>
      </div>
    </div>

    <div class="submit-btn-container">
      <button class="submit-action-btn" (click)="initialize()" type="button">
        <span>Start AI Assistance</span>
        <mat-icon>auto_awesome</mat-icon>
      </button>
    </div>
  </div>
</div>

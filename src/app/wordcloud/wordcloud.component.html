<div class="top-container">
    <mat-form-field appearance="outline" class="app-selector-field">
        <mat-label>{{shouldWait ? 'Loading apps '+currentApp + ' / '+totalApps :'Select App'}}</mat-label>
        <mat-select (selectionChange)="appSelected($event)">
            <mat-option *ngFor="let app of apps" [value]="app">
                {{app.appName}} - {{app.isIOS ? 'iOS': 'Android'}}
            </mat-option>
        </mat-select>
    </mat-form-field>
    
    <div class="actions-group" *ngIf="!!selectedApp && !loading">
        <button mat-raised-button class="shuffle-button" (click)="redraw()" title="Shuffle">
            <span class="btn-text">Shuffle</span>
            <span class="material-symbols-outlined">shuffle</span>
        </button>
        <button mat-raised-button class="shuffle-button" (click)="getWordReport()" title="Get Word Report">
            <span class="btn-text">Report</span>
            <span class="material-symbols-outlined">list_alt</span>
        </button>
        <button mat-raised-button class="shuffle-button icon-only" (click)="zoomIn()" title="Zoom In">
            <span class="material-symbols-outlined">zoom_in</span>
        </button>
        <button mat-raised-button class="shuffle-button icon-only" (click)="zoomOut()" title="Zoom Out">
            <span class="material-symbols-outlined">zoom_out</span>
        </button>
        <button mat-raised-button class="shuffle-button icon-only" (click)="download()" title="Save Image">
            <span class="material-symbols-outlined">download</span>
        </button>
        <div class="words-badge">
            Words: <strong>{{words.length}}</strong>
        </div>
    </div>
</div>

<div class="loading-container" *ngIf="loading">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>

<div class="canvas-container">
    <canvas #wordCloudContainer id="canvas">{{chart}}</canvas>
</div>
